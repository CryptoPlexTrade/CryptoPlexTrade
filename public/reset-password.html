<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="css/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Set New Password — CryptoPlexTrade</title>
    <meta name="description" content="Update your CryptoPlexTrade security credentials. Set a robust passphrase for your trading account.">
    
    <!-- Design System Stylesheets -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-canvas, #f6f9fc);
            color: var(--text-1, #0a192f);
        }

        .auth-topbar {
            padding: 16px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle, #e2e8f0);
            background: #ffffff;
            backdrop-filter: blur(16px);
        }

        .auth-topbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .auth-topbar-brand img {
            height: 36px;
            width: auto;
            border-radius: var(--radius-md, 10px);
        }

        .auth-topbar-brand span {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary, #0052cc);
            letter-spacing: -0.02em;
        }

        .reset-main-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 24px 120px;
        }

        .reset-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border: 1px solid var(--border-subtle, #e2e8f0);
            border-radius: 24px;
            padding: 44px 40px;
            box-shadow: 0 10px 40px rgba(11, 45, 90, 0.08);
            animation: cardFade 0.4s var(--ease-decelerate, cubic-bezier(0, 0, 0.2, 1));
        }

        @keyframes cardFade {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .reset-icon-badge {
            width: 60px;
            height: 60px;
            border-radius: var(--radius-lg, 12px);
            background: var(--blue-050, #f0f7ff);
            border: 1px solid rgba(0, 82, 204, 0.2);
            color: var(--primary, #0052cc);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .reset-icon-badge svg {
            width: 28px;
            height: 28px;
        }

        .reset-card h1 {
            text-align: center;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-1, #0a192f);
            margin-bottom: 8px;
        }

        .reset-card p.sub {
            text-align: center;
            font-size: 0.92rem;
            color: var(--text-2, #475569);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        #message {
            border-radius: var(--radius-md, 10px);
            padding: 12px 16px;
            font-size: 0.88rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
            display: none;
        }

        #message.success {
            background: #f0fdf4;
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #15803d;
        }

        #message.error {
            background: #fef2f2;
            border: 1px solid rgba(220, 38, 38, 0.3);
            color: #b91c1c;
        }

        .auth-field {
            margin-bottom: 18px;
        }

        .auth-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-1, #0a192f);
            margin-bottom: 8px;
        }

        .auth-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .auth-input-icon {
            position: absolute;
            left: 16px;
            color: var(--text-3, #64748b);
            pointer-events: none;
            display: flex;
        }

        .auth-input,
        input.auth-input,
        input[type="password"].auth-input {
            width: 100%;
            padding: 14px 44px 14px 46px;
            background: #ffffff !important;
            border: 1.5px solid var(--border-medium, #cbd5e1) !important;
            border-radius: 9999px;
            font-family: inherit;
            font-size: 0.92rem;
            color: var(--text-1, #0a192f) !important;
            outline: none;
            transition: all var(--duration-fast, 0.15s);
            box-sizing: border-box;
        }

        .auth-input:focus,
        input.auth-input:focus {
            background: #ffffff !important;
            color: var(--text-1, #0a192f) !important;
            border-color: var(--primary, #0052cc) !important;
            box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.15) !important;
        }

        .auth-input:-webkit-autofill,
        .auth-input:-webkit-autofill:hover, 
        .auth-input:-webkit-autofill:focus, 
        .auth-input:-webkit-autofill:active,
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px #ffffff inset !important;
            box-shadow: 0 0 0 1000px #ffffff inset !important;
            -webkit-text-fill-color: #0a192f !important;
            caret-color: #0a192f !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .auth-pw-toggle {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-3, #64748b);
            padding: 0;
            display: flex;
            transition: color var(--duration-fast, 0.15s);
        }

        .auth-pw-toggle:hover {
            color: var(--primary, #0052cc);
        }

        /* Password Strength Bar */
        .strength-bar {
            margin-top: 8px;
            height: 4px;
            border-radius: 9999px;
            background: #e2e8f0;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            border-radius: 9999px;
            transition: width 0.3s ease, background 0.3s ease;
            width: 0%;
        }

        .strength-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-3, #64748b);
            margin-top: 5px;
            display: flex;
            justify-content: flex-end;
        }

        .auth-submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary, #0052cc) 0%, #0077c8 100%);
            color: #ffffff;
            border: none;
            border-radius: 9999px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--duration-fast, 0.15s);
            box-shadow: 0 4px 16px rgba(0, 82, 204, 0.25);
            margin-top: 10px;
        }

        .auth-submit-btn:hover {
            box-shadow: 0 6px 22px rgba(0, 82, 204, 0.35);
            transform: translateY(-1px);
        }

        .auth-submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .reset-page-footer {
            text-align: center;
            padding: 24px 0 80px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
    <script src="theme.js"></script>
</head>
<body>

    <header class="auth-topbar">
        <a href="index.html" class="auth-topbar-brand">
            <img src="css/logo.png" alt="CryptoPlexTrade Logo">
            <span>CryptoPlexTrade</span>
        </a>
        <div style="font-size: 0.85rem;">
            Back to <a href="login.html" style="color: var(--primary-color); font-weight: 600;">Sign In &rarr;</a>
        </div>
    </header>

    <main class="reset-main-stage">
        <div class="reset-card">
            <div class="reset-icon-badge">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3A5.25 5.25 0 0 0 12 1.5Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z" clip-rule="evenodd"/>
                </svg>
            </div>

            <h1>Set New Password</h1>
            <p class="sub">Choose a robust, unique password to secure your institutional trading account.</p>

            <div id="message" role="alert"></div>

            <form id="reset-password-form" novalidate>
                <!-- New Password -->
                <div class="auth-field">
                    <label class="auth-label" for="new-password">New Password</label>
                    <div class="auth-input-wrapper">
                        <span class="auth-input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3A5.25 5.25 0 0 0 12 1.5Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z" clip-rule="evenodd"/>
                            </svg>
                        </span>
                        <input class="auth-input" type="password" id="new-password" name="new-password" placeholder="Min. 8 characters" required>
                        <button type="button" class="auth-pw-toggle" id="toggle-pw1" aria-label="Toggle password visibility">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3.53 2.47a.75.75 0 0 0-1.06 1.06l18 18a.75.75 0 1 0 1.06-1.06l-18-18ZM22.676 12.553a11.249 11.249 0 0 1-2.631 4.31l-3.099-3.099a5.25 5.25 0 0 0-6.71-6.71L7.759 4.577a11.217 11.217 0 0 1 4.242-.827c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113Z"/><path d="M15.75 12c0 .18-.013.357-.037.53l-4.244-4.243A3.75 3.75 0 0 1 15.75 12ZM12.25 15.75l-4.243-4.244a3.75 3.75 0 0 0 4.243 4.244ZM4.867 16.842l-1.634-1.635a11.25 11.25 0 0 1-1.909-3.655.75.75 0 0 1 0-.553C2.816 6.723 7.03 3.5 12.001 3.5c1.457 0 2.85.294 4.116.826L14.53 5.916A5.251 5.251 0 0 0 8.25 12a5.21 5.21 0 0 0 .617 2.47L4.867 16.842Z"/></svg>
                        </button>
                    </div>
                    <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
                    <div class="strength-label" id="strength-label"></div>
                </div>

                <!-- Confirm Password -->
                <div class="auth-field">
                    <label class="auth-label" for="confirm-password">Confirm New Password</label>
                    <div class="auth-input-wrapper">
                        <span class="auth-input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3A5.25 5.25 0 0 0 12 1.5Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z" clip-rule="evenodd"/>
                            </svg>
                        </span>
                        <input class="auth-input" type="password" id="confirm-password" name="confirm-password" placeholder="Repeat new password" required>
                        <button type="button" class="auth-pw-toggle" id="toggle-pw2" aria-label="Toggle password visibility">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3.53 2.47a.75.75 0 0 0-1.06 1.06l18 18a.75.75 0 1 0 1.06-1.06l-18-18ZM22.676 12.553a11.249 11.249 0 0 1-2.631 4.31l-3.099-3.099a5.25 5.25 0 0 0-6.71-6.71L7.759 4.577a11.217 11.217 0 0 1 4.242-.827c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113Z"/><path d="M15.75 12c0 .18-.013.357-.037.53l-4.244-4.243A3.75 3.75 0 0 1 15.75 12ZM12.25 15.75l-4.243-4.244a3.75 3.75 0 0 0 4.243 4.244ZM4.867 16.842l-1.634-1.635a11.25 11.25 0 0 1-1.909-3.655.75.75 0 0 1 0-.553C2.816 6.723 7.03 3.5 12.001 3.5c1.457 0 2.85.294 4.116.826L14.53 5.916A5.251 5.251 0 0 0 8.25 12a5.21 5.21 0 0 0 .617 2.47L4.867 16.842Z"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="auth-submit-btn" id="submit-btn">Update Account Password</button>
            </form>
        </div>
    </main>

    <footer class="reset-page-footer">
        &copy; 2026 CryptoPlexTrade. All rights reserved.
    </footer>

    <!-- Ticker Tape -->
    <div class="ticker-tape">
        <div class="ticker-tape__track" id="ticker-track"></div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const resetForm = document.getElementById('reset-password-form');
        const msg = document.getElementById('message');
        const token = new URLSearchParams(window.location.search).get('token');

        if (!token) { 
            msg.textContent = 'Invalid or expired password reset token. Please request a new link.'; 
            msg.className = 'error'; 
            msg.style.display = 'block'; 
            resetForm.style.display = 'none'; 
        }

        /* Password visibility toggles */
        document.getElementById('toggle-pw1').addEventListener('click', () => { 
            const i = document.getElementById('new-password'); 
            i.type = i.type === 'password' ? 'text' : 'password'; 
        });
        document.getElementById('toggle-pw2').addEventListener('click', () => { 
            const i = document.getElementById('confirm-password'); 
            i.type = i.type === 'password' ? 'text' : 'password'; 
        });

        /* Strength meter */
        document.getElementById('new-password').addEventListener('input', function() {
            const v = this.value;
            const fill = document.getElementById('strength-fill');
            const lbl = document.getElementById('strength-label');
            let score = 0;
            if (v.length >= 8) score++;
            if (/[A-Z]/.test(v)) score++;
            if (/[0-9]/.test(v)) score++;
            if (/[^A-Za-z0-9]/.test(v)) score++;
            const levels = [
                { w: '25%', c: '#dc2626', t: 'Weak' },
                { w: '50%', c: '#f59e0b', t: 'Fair' },
                { w: '75%', c: '#005baa', t: 'Good' },
                { w: '100%', c: '#16a34a', t: 'Strong' }
            ];
            const l = levels[Math.max(0, score - 1)] || levels[0];
            if (v.length === 0) { 
                fill.style.width = '0'; 
                lbl.textContent = ''; 
            } else { 
                fill.style.width = l.w; 
                fill.style.background = l.c; 
                lbl.textContent = l.t; 
                lbl.style.color = l.c; 
            }
        });

        resetForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const newPw = document.getElementById('new-password').value;
            const confirmPw = document.getElementById('confirm-password').value;
            const btn = document.getElementById('submit-btn');
            msg.style.display = 'none';

            if (newPw.length < 8) { 
                msg.textContent = 'Password must be at least 8 characters long.';
                msg.className = 'error';
                msg.style.display = 'block';
                return; 
            }
            if (newPw !== confirmPw) { 
                msg.textContent = 'Passwords do not match.';
                msg.className = 'error';
                msg.style.display = 'block';
                return; 
            }

            btn.textContent = 'Updating Password…'; 
            btn.disabled = true;

            try {
                const res = await fetch('/api/reset-password', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ token, newPassword: newPw }) 
                });
                const result = await res.json();
                if (res.ok) {
                    msg.textContent = (result.message || 'Password successfully updated.') + ' Redirecting to sign in…'; 
                    msg.className = 'success'; 
                    msg.style.display = 'block';
                    resetForm.style.display = 'none';
                    setTimeout(() => window.location.href = 'login.html', 2500);
                } else { 
                    throw new Error(result.message || 'Could not reset password.'); 
                }
            } catch(err) { 
                msg.textContent = err.message || 'An error occurred during password update.'; 
                msg.className = 'error'; 
                msg.style.display = 'block'; 
                btn.textContent = 'Update Account Password'; 
                btn.disabled = false; 
            }
        });
    });
    </script>
    <script src="ticker.js"></script>
    <script src="/chat-widget.js?v=2"></script>
</body>
</html>
