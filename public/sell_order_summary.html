    <style>
        body { overflow-y: auto; background: var(--bg); font-family: var(--font-sans); color: var(--text-1); }
        .os-wrap { min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; }

        .os-topbar {
            background: var(--bg-white); border-bottom: 1px solid var(--border);
            padding: 0 32px; height: 64px;
            display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0; position: sticky; top: 0; z-index: 100;
        }
        .os-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        img.os-brand__orb { width: auto; height: 38px; border-radius: 8px; object-fit: contain; }
        .os-brand__name { font-size: 0.95rem; font-weight: 700; color: var(--text-1); letter-spacing: -0.01em; }
        .os-topbar-right { display: flex; gap: 10px; align-items: center; }

        .os-main {
            flex: 1; display: flex; align-items: flex-start;
            justify-content: center; padding: 48px 20px 100px;
        }
        .os-container { width: 100%; max-width: 560px; }

        /* Steps */
        .steps { display: flex; align-items: flex-start; margin-bottom: 28px; position: relative; }
        .step-item { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
        .step-item:not(:last-child)::after {
            content: ''; position: absolute; top: 18px; left: 50%;
            width: 100%; height: 2px; background: var(--border); z-index: 0;
        }
        .step-item.active:not(:last-child)::after { background: var(--border); }
        .step-num {
            width: 36px; height: 36px; border-radius: 50%;
            border: 2px solid var(--border-mid); background: var(--bg-white);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 700; color: var(--text-3);
            position: relative; z-index: 1; transition: all 0.2s;
        }
        .step-item.active .step-num {
            background: var(--primary);
            border-color: var(--primary); color: white;
            box-shadow: 0 0 0 4px rgba(0,91,170,0.14);
        }
        .step-item.done .step-num {
            background: var(--green); border-color: var(--green); color: white;
        }
        .step-label {
            font-size: 0.75rem; font-weight: 600; color: var(--text-3);
            margin-top: 8px; text-align: center; white-space: nowrap;
        }
        .step-item.active .step-label { color: var(--primary); font-weight: 700; }
        .step-item.done .step-label { color: var(--text-2); }

        /* Summary Card */
        .summary-card {
            background: var(--bg-white); border: 1px solid var(--border);
            border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden;
        }
        .summary-card__header {
            padding: 24px 28px 20px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 14px;
            background: var(--bg-subtle);
        }
        .summary-card__icon {
            width: 44px; height: 44px; border-radius: var(--radius);
            background: #ecfdf5; border: 1px solid #a7f3d0;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            color: var(--green);
        }
        .summary-card__icon svg { width: 22px; height: 22px; }
        .summary-card__titles h2 { font-size: 1.15rem; font-weight: 700; color: var(--text-1); margin: 0 0 2px; letter-spacing: -0.01em; }
        .summary-card__titles p { font-size: 0.8rem; color: var(--text-3); margin: 0; }

        .summary-rows { padding: 4px 0; }
        .summary-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 28px; border-bottom: 1px solid var(--border);
        }
        .summary-row:last-child { border-bottom: none; }
        .summary-row__label { font-size: 0.82rem; font-weight: 600; color: var(--text-3); }
        .summary-row__value { font-size: 0.9rem; font-weight: 600; color: var(--text-1); text-align: right; }
        .summary-row--total {
            background: #ecfdf5;
            border-top: 1px solid #a7f3d0;
            border-bottom: 1px solid #a7f3d0;
        }
        .summary-row--total .summary-row__label { font-size: 0.875rem; font-weight: 700; color: #047857; }
        .summary-row--total .summary-row__value { font-size: 1.25rem; font-weight: 700; color: #059669; font-family: var(--font-mono); }

        .os-cta { padding: 24px 28px; border-top: 1px solid var(--border); background: var(--bg-white); }

        @media (max-width: 540px) {
            .os-topbar { padding: 0 16px; }
            .os-brand__name { display: none; }
            .summary-card__header, .summary-row, .os-cta { padding-left: 18px; padding-right: 18px; }
            .step-label { font-size: 0.68rem; }
        }
    </style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const orderDetails = JSON.parse(localStorage.getItem('sellOrderDetails'));
    if (!orderDetails) {
        alert('No sell order details found. Redirecting to trade page.');
        window.location.href = 'trade.html';
        return;
    }

    // --- Browser Back-Forward Cache & Swipe-Back Guard ---
    window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
            window.location.reload();
        }
    });

    // Logout
    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await fetch('/api/logout', { method: 'POST' });
            } catch (err) { console.error(err); }
            localStorage.removeItem('sellOrderDetails');
            window.location.href = 'login.html';
        });
    }

    // Populate summary
    const cryptoPrecision = String(orderDetails.product).startsWith('USDT_') ? 2 : 8;
    const cryptoSymbol = String(orderDetails.product).replace('_TRC20', '').replace('_ERC20', '');
    document.getElementById('summary-product-amount').textContent = `${parseFloat(orderDetails.productAmount).toFixed(cryptoPrecision)} ${cryptoSymbol}`;
    document.getElementById('summary-ghs').textContent = `₵ ${parseFloat(orderDetails.ghsToReceive).toFixed(2)}`;

    document.getElementById('proceed-to-payment').addEventListener('click', function() {
        window.location.href = 'sell_send_crypto.html';
    });

    // Ticker Tape
    const tickerTrack = document.querySelector('.ticker-tape__track');
    const coinSymbols = ['BTC', 'ETH', 'SOL', 'BNB', 'XRP', 'LTC', 'ADA', 'DOGE'];
    async function fetchLiveRates() {
        try {
            const r = await fetch('/api/market-rates');
            if (!r.ok) throw new Error();
            const data = await r.json();
            let html = '';
            coinSymbols.forEach(s => {
                const c = data.RAW[s]?.USD; if (!c) return;
                const dir = c.CHANGEPCT24HOUR >= 0 ? 'up' : 'down';
                const sign = dir === 'up' ? '+' : '';
                html += `<div class="ticker-tape__item"><span class="pair">${s}/USD</span><span class="price">${c.PRICE.toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2})}</span><span class="change ${dir}">${sign}${c.CHANGEPCT24HOUR.toFixed(2)}% ${dir==='up'?'▲':'▼'}</span></div>`;
            });
            tickerTrack.innerHTML = html + html;
        } catch(e) { console.error('Ticker error', e); }
    }
    fetchLiveRates();
    setInterval(fetchLiveRates, 60000);
});
</script>
