<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="css/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Recover Password — CryptoPlexTrade</title>
    <meta name="description" content="Reset your CryptoPlexTrade account password securely. Enter your registered email address to receive an authorized recovery link.">
    
    <!-- Design System Stylesheets -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 50% -10%, #131b2e 0%, #080b11 75%);
            color: #ffffff;
        }

        .auth-topbar {
            padding: 16px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(8, 11, 17, 0.9);
            backdrop-filter: blur(16px);
        }

        .auth-topbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .auth-topbar-brand img {
            height: 36px;
            width: auto;
            border-radius: var(--radius-md);
        }

        .auth-topbar-brand span {
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .recovery-main-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 24px 120px;
        }

        .recovery-card {
            width: 100%;
            max-width: 440px;
            background: rgba(14, 19, 32, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 44px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            animation: cardFade 0.4s var(--ease-decelerate);
        }

        @keyframes cardFade {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .recovery-icon-badge {
            width: 60px;
            height: 60px;
            border-radius: var(--radius-lg);
            background: var(--bg-highlight);
            border: 1px solid rgba(0, 91, 170, 0.2);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .recovery-icon-badge svg {
            width: 28px;
            height: 28px;
        }

        .recovery-card h1 {
            text-align: center;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .recovery-card p.sub {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        #message {
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            font-size: 0.85rem;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 20px;
            display: none;
        }

        #message.success {
            background: #f0fdf4;
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: var(--accent-green);
        }

        #message.error {
            background: #fef2f2;
            border: 1px solid rgba(220, 38, 38, 0.3);
            color: var(--accent-red);
        }

        .auth-field {
            margin-bottom: 20px;
        }

        .auth-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .auth-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .auth-input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            pointer-events: none;
            display: flex;
        }

        .auth-input,
        input.auth-input,
        input[type="email"].auth-input {
            width: 100%;
            padding: 13px 14px 13px 44px;
            background: #0b101c !important;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
            font-family: inherit;
            font-size: 0.92rem;
            color: #ffffff !important;
            outline: none;
            transition: all var(--duration-fast);
        }

        .auth-input:focus,
        input.auth-input:focus {
            background: #111827 !important;
            color: #ffffff !important;
            border-color: #ffffff;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.18);
        }

        .auth-input:-webkit-autofill,
        .auth-input:-webkit-autofill:hover, 
        .auth-input:-webkit-autofill:focus, 
        .auth-input:-webkit-autofill:active,
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px #0b101c inset !important;
            box-shadow: 0 0 0 1000px #0b101c inset !important;
            -webkit-text-fill-color: #ffffff !important;
            caret-color: #ffffff !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .auth-submit-btn {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #080b11;
            border: none;
            border-radius: 9999px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--duration-fast);
            box-shadow: 0 4px 16px rgba(255, 255, 255, 0.22);
        }

        .auth-submit-btn:hover {
            background: #f1f5f9;
            box-shadow: 0 6px 22px rgba(255, 255, 255, 0.35);
            transform: translateY(-1px);
        }

        .auth-submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .recovery-footer-link {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .recovery-footer-link a {
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
        }

        .recovery-footer-link a:hover {
            text-decoration: underline;
        }

        .recovery-page-footer {
            text-align: center;
            padding: 24px 0 80px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
    <script src="theme.js"></script>
</head>
<body>

    <header class="auth-topbar">
        <a href="index.html" class="auth-topbar-brand">
            <img src="css/logo.png" alt="CryptoPlexTrade Logo">
            <span>CryptoPlexTrade</span>
        </a>
        <div style="font-size: 0.85rem;">
            Remember your credentials? <a href="login.html" style="color: var(--primary-color); font-weight: 600;">Sign in &rarr;</a>
        </div>
    </header>

    <main class="recovery-main-stage">
        <div class="recovery-card">
            <div class="recovery-icon-badge">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3A5.25 5.25 0 0 0 12 1.5Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z" clip-rule="evenodd"/>
                </svg>
            </div>

            <h1>Password Recovery</h1>
            <p class="sub">Enter your registered email address and our cryptographic dispatch will generate a secure reset link.</p>

            <div id="message" role="alert"></div>

            <form id="forgot-password-form" novalidate>
                <div class="auth-field">
                    <label class="auth-label" for="email">Account Email Address</label>
                    <div class="auth-input-wrapper">
                        <span class="auth-input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-8.928 5.493a3 3 0 0 1-3.144 0L1.5 8.67Z"/>
                                <path d="M22.5 6.908V6.75a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3v.158l9.714 5.978a1.5 1.5 0 0 0 1.572 0L22.5 6.908Z"/>
                            </svg>
                        </span>
                        <input class="auth-input" type="email" id="email" name="email" placeholder="name@domain.com" required autocomplete="email">
                    </div>
                </div>

                <button type="submit" class="auth-submit-btn" id="submit-btn">Send Recovery Link</button>
            </form>

            <p class="recovery-footer-link">
                Return to <a href="login.html">Sign In</a> or contact <a href="help.html">Support</a>
            </p>
        </div>
    </main>

    <footer class="recovery-page-footer">
        &copy; 2026 CryptoPlexTrade. All rights reserved.
    </footer>

    <!-- Ticker Tape -->
    <div class="ticker-tape">
        <div class="ticker-tape__track" id="ticker-track"></div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('forgot-password-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const msg = document.getElementById('message');
            const btn = document.getElementById('submit-btn');

            msg.style.display = 'none';
            if (!email) { 
                msg.textContent = 'Please enter your account email address.';
                msg.className = 'error';
                msg.style.display = 'block';
                return; 
            }

            btn.textContent = 'Generating Token…'; 
            btn.disabled = true;

            try {
                const res = await fetch('/api/forgot-password', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ email }) 
                });
                const result = await res.json();

                if (res.ok) {
                    btn.textContent = '✓ Recovery Link Dispatched';
                    btn.style.background = 'var(--accent-green)';

                    msg.innerHTML = `${result.message || 'Recovery instructions sent.'}<br><small style="opacity:0.9;">If not received within 2 minutes, check your <strong>spam / junk</strong> folder.</small>`;
                    msg.className = 'success'; 
                    msg.style.display = 'block';

                    setTimeout(function () {
                        btn.textContent = 'Resend Recovery Link';
                        btn.style.background = '';
                        btn.disabled = false;
                    }, 5000);
                } else {
                    msg.textContent = result.message || 'Recovery request failed. Please check the email entered.';
                    msg.className = 'error'; 
                    msg.style.display = 'block';
                    btn.textContent = 'Send Recovery Link'; 
                    btn.disabled = false;
                }
            } catch (err) {
                msg.textContent = 'System communication failure. Please verify network access and retry.';
                msg.className = 'error'; 
                msg.style.display = 'block';
                btn.textContent = 'Send Recovery Link'; 
                btn.disabled = false;
            }
        });
    });
    </script>
    <script src="ticker.js"></script>
    <script src="/chat-widget.js"></script>
</body>
</html>
