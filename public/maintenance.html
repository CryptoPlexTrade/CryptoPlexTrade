<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="css/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>System Maintenance — CryptoPlexTrade</title>
    
    <!-- Design System Stylesheets -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 0%, #0c1f40 0%, #050d1e 60%, #040914 100%);
            color: #ffffff;
            padding: 24px;
        }

        .maintenance-panel {
            width: 100%;
            max-width: 520px;
            background: #081326;
            border: 1px solid rgba(0, 169, 224, 0.22);
            border-radius: var(--radius-xl);
            padding: 48px 40px;
            text-align: center;
            box-shadow: var(--shadow-md);
            position: relative;
        }

        .maint-icon-badge {
            width: 72px;
            height: 72px;
            border-radius: var(--radius-lg);
            background: #fffbeb;
            border: 1px solid #fde68a;
            color: #d97706;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 4px 14px rgba(217, 119, 6, 0.15);
        }

        .maint-icon-badge svg {
            width: 36px;
            height: 36px;
        }

        .maint-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: #fffbeb;
            border: 1px solid #fcd34d;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #b45309;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .maint-pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f59e0b;
            animation: maintDot 1.4s ease-in-out infinite;
        }

        @keyframes maintDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
        }

        .maintenance-panel h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .maintenance-panel p.lead-msg {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .maint-progress {
            width: 100%;
            height: 4px;
            background: var(--border-light);
            border-radius: 9999px;
            overflow: hidden;
            margin-bottom: 32px;
        }

        .maint-progress-fill {
            height: 100%;
            width: 40%;
            background: var(--primary-color);
            border-radius: 9999px;
            animation: maintIndeterminate 2s ease-in-out infinite;
        }

        @keyframes maintIndeterminate {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }

        .maint-contact {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .maint-contact a {
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="maintenance-panel">
        <div class="maint-icon-badge">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path fill-rule="evenodd" d="M12 6.75a5.25 5.25 0 0 1 6.775-5.025.75.75 0 0 1 .313 1.248l-3.32 3.319c.063.475.276.934.641 1.299.365.365.824.578 1.3.64l3.318-3.319a.75.75 0 0 1 1.248.313 5.25 5.25 0 0 1-5.472 6.756c-1.018-.086-1.87.1-2.309.634L7.344 21.3A3.298 3.298 0 1 1 2.7 16.657l8.684-7.151c.533-.44.72-1.291.634-2.309A5.342 5.342 0 0 1 12 6.75ZM4.117 19.125a.75.75 0 0 1 .75-.75h.008a.75.75 0 0 1 .75.75v.008a.75.75 0 0 1-.75.75h-.008a.75.75 0 0 1-.75-.75v-.008Z" clip-rule="evenodd"/>
            </svg>
        </div>

        <div class="maint-status-pill">
            <span class="maint-pulse-dot"></span>
            Scheduled Engine Upgrade
        </div>

        <h1>Platform Maintenance</h1>
        <p class="lead-msg" id="custom-message">We are performing infrastructure optimizations to enhance transaction throughput and order matching latency. Platform operations will resume shortly.</p>

        <div class="maint-progress">
            <div class="maint-progress-fill"></div>
        </div>

        <p class="maint-contact">
            CryptoPlexTrade Exchange &bull; Need urgent assistance? <a href="mailto:Supportteam@cryptoplextrades.com">Contact Support Desk</a>
        </p>
    </div>

    <script>
    (async () => {
        try {
            const r = await fetch('/api/maintenance');
            if (r.ok) {
                const data = await r.json();
                if (data.message) {
                    document.getElementById('custom-message').textContent = data.message;
                }
            }
        } catch(e) {}

        // Periodically check if maintenance has concluded
        setInterval(async () => {
            try {
                const r = await fetch('/api/maintenance');
                if (r.ok) {
                    const data = await r.json();
                    if (!data.active) {
                        window.location.href = '/';
                    }
                }
            } catch(e) {}
        }, 15000);
    })();
    </script>
</body>
</html>
