<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="css/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Open Support Ticket — CryptoPlexTrade</title>
    <meta name="description" content="Submit a direct operational inquiry or support ticket to the CryptoPlexTrade clearing desk.">
    
    <!-- Design System Stylesheets -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        .ticket-create-container {
            max-width: 640px;
            margin: 0 auto;
        }

        .ticket-form-card {
            background: #ffffff;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            padding: 36px 36px;
            box-shadow: var(--shadow-sm);
        }

        .form-group-item {
            margin-bottom: 22px;
        }

        .form-group-item label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .form-group-item input,
        .form-group-item textarea {
            width: 100%;
            padding: 12px 14px;
            background: #f8fafc;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.92rem;
            color: var(--text-primary);
            outline: none;
            transition: all var(--duration-fast);
        }

        .form-group-item input:focus,
        .form-group-item textarea:focus {
            background: #ffffff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 91, 170, 0.12);
        }

        .form-group-item textarea {
            min-height: 140px;
            resize: vertical;
        }

        .btn-ticket-submit {
            padding: 13px 28px;
            background: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all var(--duration-fast);
        }

        .btn-ticket-submit:hover {
            background: var(--primary-dark);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .msg-banner {
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 18px;
            display: none;
        }

        .msg-banner.success {
            background: #f0fdf4;
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: var(--accent-green);
        }

        .msg-banner.error {
            background: #fef2f2;
            border: 1px solid rgba(220, 38, 38, 0.3);
            color: var(--accent-red);
        }
    </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="app-shell">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <a href="dashboard.html" class="sidebar-brand">
            <img src="css/logo-mark.png" alt="CryptoPlexTrade Emblem" class="sidebar-brand__orb">
            <span class="sidebar-brand__name">CryptoPlexTrade</span>
        </a>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="dashboard.html">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M11.47 3.841a.75.75 0 0 1 1.06 0l8.69 8.69a.75.75 0 1 0 1.06-1.061l-8.689-8.69a2.25 2.25 0 0 0-3.182 0l-8.69 8.69a.75.75 0 1 0 1.061 1.06l8.69-8.689Z"/><path d="m12 5.432 8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 0 1-.75-.75v-4.5a.75.75 0 0 0-.75-.75h-3a.75.75 0 0 0-.75.75V21a.75.75 0 0 1-.75.75H5.625a1.875 1.875 0 0 1-1.875-1.875v-6.198a2.29 2.29 0 0 0 .091-.086L12 5.432Z"/></svg>
                    Dashboard
                </a></li>
                <li><a href="trade.html">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4.5h18v15H3v-15Zm6.75 10.5a.75.75 0 0 0-1.5 0v1.5a.75.75 0 0 0 1.5 0v-1.5ZM12 15a.75.75 0 0 0-1.5 0v1.5a.75.75 0 0 0 1.5 0v-1.5ZM15.75 15a.75.75 0 0 0-1.5 0v1.5a.75.75 0 0 0 1.5 0v-1.5ZM9.75 9a.75.75 0 0 0-1.5 0v4.5a.75.75 0 0 0 1.5 0V9Zm3.75-3a.75.75 0 0 0-1.5 0v7.5a.75.75 0 0 0 1.5 0V6Zm2.25 1.5a.75.75 0 0 0-1.5 0v6a.75.75 0 0 0 1.5 0v-6Z"/></svg>
                    Trade Desk
                </a></li>
                <li><a href="transactions.html">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25ZM12.75 6a.75.75 0 0 0-1.5 0v6c0 .414.336.75.75.75h4.5a.75.75 0 0 0 0-1.5h-3.75V6Z" clip-rule="evenodd"/></svg>
                    Ledger History
                </a></li>
                <li><a href="profile.html">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z" clip-rule="evenodd"/></svg>
                    Account Profile
                </a></li>
                <li><a href="support.html" class="active">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm11.378-3.917c-.89-.777-2.366-.777-3.255 0a.75.75 0 0 1-1.06-1.06c2.298-2.013 5.824-2.013 8.122 0a.75.75 0 0 1-1.06 1.06ZM12 15.75a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z" clip-rule="evenodd"/></svg>
                    Help &amp; Support
                </a></li>
            </ul>
        </nav>
    </aside>

    <div class="main-wrap">
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger-btn" id="hamburger-btn" aria-label="Toggle navigation">
                    <span></span><span></span><span></span>
                </button>
                <span class="topbar-title">Submit Inquiry</span>
            </div>
            <div class="topbar-right">
                <a href="#" id="logout-btn" class="btn btn-danger btn-sm">Sign Out</a>
            </div>
        </header>

        <main class="page-content">
            <div class="ticket-create-container">
                <div style="margin-bottom: 24px;">
                    <a href="support.html" style="font-size:0.85rem;color:var(--primary-color);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;">&larr; Return to Ticket Ledger</a>
                    <h1 style="font-size:1.75rem; font-weight:800; letter-spacing:-0.03em; color:var(--text-primary); margin-bottom:4px;">Open Support Ticket</h1>
                    <p style="font-size:0.9rem; color:var(--text-secondary);">Direct operational inquiry dispatched to compliance and clearing staff.</p>
                </div>

                <div class="ticket-form-card">
                    <form id="create-ticket-form">
                        <div class="form-group-item">
                            <label for="subject">Subject / Inquiry Title</label>
                            <input type="text" id="subject" name="subject" required placeholder="e.g. Order #1042 Settlement Status Inquiry">
                        </div>
                        <div class="form-group-item">
                            <label for="message">Detailed Description</label>
                            <textarea id="message" name="message" required placeholder="Describe your inquiry, transaction reference, or wallet address details clearly…"></textarea>
                        </div>
                        <button type="submit" class="btn-ticket-submit">Dispatch Ticket &rarr;</button>
                        <div id="form-message" class="msg-banner"></div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="inactivity-timer.js"></script>
<script src="chat-widget.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    document.getElementById('hamburger-btn').addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.add('open'); });
    overlay.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); });

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
    }
    const csrfToken = getCookie('csrf-token');

    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                const response = await fetch('/api/logout', { method: 'POST', headers: { 'X-CSRF-Token': csrfToken } });
                if (response.ok) window.location.href = 'login.html';
            } catch (error) { console.error('Logout failed:', error); }
        });
    }

    const ticketForm = document.getElementById('create-ticket-form');
    const formMessage = document.getElementById('form-message');

    ticketForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        const subject = document.getElementById('subject').value.trim();
        const message = document.getElementById('message').value.trim();

        if (!subject || !message) {
            formMessage.textContent = 'Please fill out both the subject and message fields.';
            formMessage.className = 'msg-banner error';
            formMessage.style.display = 'block';
            return;
        }

        try {
            const response = await fetch('/api/support/tickets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
                body: JSON.stringify({ subject, message })
            });
            if (response.status === 401 || response.status === 403) {
                window.location.href = 'login.html';
                return;
            }
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Failed to submit ticket.');

            formMessage.textContent = 'Ticket dispatched successfully! Redirecting to ticket desk…';
            formMessage.className = 'msg-banner success';
            formMessage.style.display = 'block';
            setTimeout(() => {
                window.location.href = 'support.html';
            }, 1800);

        } catch (error) {
            formMessage.textContent = error.message || 'Communication error occurred.';
            formMessage.className = 'msg-banner error';
            formMessage.style.display = 'block';
        }
    });
});
</script>
</body>
</html>
