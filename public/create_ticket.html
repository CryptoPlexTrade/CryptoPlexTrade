    <!-- Immediate Client Auth Guard -->
    <script>
    (async function() {
        try {
            const r = await fetch('/api/user/me', { credentials: 'include' });
            if (!r.ok) {
                window.location.replace('login.html?redirect=create_ticket.html');
            }
        } catch (_) {
            window.location.replace('login.html?redirect=create_ticket.html');
        }
    })();
    </script>

    <style>
        .ticket-create-container {
            max-width: 640px;
            margin: 0 auto;
        }

        .ticket-form-card {
            background: #ffffff;
            border: 1px solid var(--border-subtle, #e2e8f0);
            border-radius: var(--radius-2xl, 20px);
            padding: 36px 36px;
            box-shadow: 0 4px 20px rgba(11, 45, 90, 0.05);
        }

        .form-group-item {
            margin-bottom: 22px;
        }

        .form-group-item label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-1, #0a192f);
            margin-bottom: 8px;
        }

        .form-group-item input,
        .form-group-item textarea {
            width: 100%;
            padding: 13px 16px;
            background: #ffffff;
            border: 1.5px solid var(--border-medium, #cbd5e1);
            border-radius: var(--radius-md, 10px);
            font-family: inherit;
            font-size: 0.92rem;
            color: var(--text-1, #0a192f);
            outline: none;
            transition: all var(--duration-fast, 0.15s);
            box-sizing: border-box;
        }

        .form-group-item input:focus,
        .form-group-item textarea:focus {
            background: #ffffff;
            color: var(--text-1, #0a192f);
            border-color: var(--primary, #0052cc);
            box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.15);
        }

        .form-group-item textarea {
            min-height: 140px;
            resize: vertical;
        }

        .btn-ticket-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 30px;
            background: linear-gradient(135deg, var(--primary, #0052cc) 0%, #0077c8 100%);
            color: #ffffff;
            border: none;
            border-radius: 9999px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 82, 204, 0.25);
            transition: all var(--duration-fast, 0.15s);
        }

        .btn-ticket-submit:hover {
            box-shadow: 0 6px 22px rgba(0, 82, 204, 0.35);
            transform: translateY(-1px);
        }

        .msg-banner {
            border-radius: var(--radius-md, 10px);
            padding: 12px 16px;
            font-size: 0.88rem;
            font-weight: 600;
            margin-top: 18px;
            display: none;
        }

        .msg-banner.success {
            background: #f0fdf4;
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #15803d;
        }

        .msg-banner.error {
            background: #fef2f2;
            border: 1px solid rgba(220, 38, 38, 0.3);
            color: #b91c1c;
        }
    </style>

</head>

            </div>

            <div class="ticket-form-card">
                <form id="create-ticket-form">
                    <div class="form-group-item">
                        <label for="subject">Subject / Title</label>
                        <input type="text" id="subject" name="subject" required placeholder="e.g. Order #1042 Settlement Inquiry">
                    </div>
                    <div class="form-group-item">
                        <label for="message">Detailed Description</label>
                        <textarea id="message" name="message" required placeholder="Describe your question, transaction reference, or wallet address details clearly…"></textarea>
                    </div>
                    <button type="submit" class="btn-ticket-submit">Send Ticket &rarr;</button>

<script src="chat-widget.js?v=2"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
    }
    const csrfToken = getCookie('csrf-token');

    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                const response = await fetch('/api/logout', { method: 'POST', headers: { 'X-CSRF-Token': csrfToken } });
                if (response.ok) window.location.href = 'login.html';
            } catch (error) { console.error('Logout failed:', error); }
        });
    }

    const ticketForm = document.getElementById('create-ticket-form');
    const formMessage = document.getElementById('form-message');

    ticketForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        const subject = document.getElementById('subject').value.trim();
        const message = document.getElementById('message').value.trim();

        if (!subject || !message) {
            formMessage.textContent = 'Please fill out both the subject and message fields.';
            formMessage.className = 'msg-banner error';
            formMessage.style.display = 'block';
            return;
        }

        try {
            const response = await fetch('/api/support/tickets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
                body: JSON.stringify({ subject, message })
            });
            if (response.status === 401 || response.status === 403) {
                window.location.href = 'login.html';
                return;
            }
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Failed to submit ticket.');

            formMessage.textContent = 'Ticket dispatched successfully! Redirecting to ticket desk…';
            formMessage.className = 'msg-banner success';
            formMessage.style.display = 'block';
            setTimeout(() => {
                window.location.href = 'support.html';
            }, 1800);

        } catch (error) {
            formMessage.textContent = error.message || 'Communication error occurred.';
            formMessage.className = 'msg-banner error';
            formMessage.style.display = 'block';
        }
    });
});
</script>
