<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="css/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Administrator Control Console — CryptoPlexTrade</title>
    <meta name="description" content="Authorized institutional administrator access portal for CryptoPlexTrade exchange management.">
    
    <!-- Design System Stylesheets -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        body.admin-login-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-canvas, #f6f9fc);
            color: var(--text-1, #0a192f);
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        body.admin-login-body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(0, 82, 204, 0.06) 1.5px, transparent 1.5px);
            background-size: 28px 28px;
            pointer-events: none;
        }

        .admin-login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border: 1px solid var(--border-subtle, #e2e8f0);
            border-radius: var(--radius-2xl, 24px);
            padding: 44px 40px;
            box-shadow: 0 10px 40px rgba(11, 45, 90, 0.08);
            position: relative;
            z-index: 2;
            animation: adminCardFade 0.4s var(--ease-decelerate, cubic-bezier(0, 0, 0.2, 1));
        }

        @keyframes adminCardFade {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .admin-brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            margin-bottom: 18px;
        }

        .admin-brand-logo img {
            height: 44px;
            width: auto;
            border-radius: var(--radius-md, 10px);
        }

        .admin-brand-logo span {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary, #0052cc);
            letter-spacing: -0.02em;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--blue-050, #f0f7ff);
            border: 1px solid rgba(0, 82, 204, 0.2);
            color: var(--primary, #0052cc);
            padding: 5px 14px;
            border-radius: 9999px;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .admin-login-card h2 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-1, #0a192f);
            letter-spacing: -0.02em;
            margin-top: 14px;
            margin-bottom: 6px;
        }

        .admin-login-card p.sub {
            font-size: 0.88rem;
            color: var(--text-2, #475569);
            line-height: 1.5;
        }

        #server-error {
            background: #fef2f2;
            border: 1px solid rgba(220, 38, 38, 0.3);
            color: #b91c1c;
            border-radius: var(--radius-md, 10px);
            padding: 12px 14px;
            font-size: 0.84rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
        }

        .admin-field {
            margin-bottom: 20px;
            text-align: left;
        }

        .admin-field label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-1, #0a192f);
            margin-bottom: 8px;
        }

        .admin-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .admin-input-icon {
            position: absolute;
            left: 16px;
            color: var(--text-3, #64748b);
            pointer-events: none;
            display: flex;
        }

        .admin-input {
            width: 100%;
            padding: 13px 44px 13px 46px;
            background: #ffffff;
            border: 1.5px solid var(--border-medium, #cbd5e1);
            border-radius: 9999px;
            font-family: inherit;
            font-size: 0.92rem;
            color: var(--text-1, #0a192f);
            outline: none;
            transition: all var(--duration-fast, 0.15s);
            box-sizing: border-box;
        }

        .admin-input:focus {
            background: #ffffff;
            border-color: var(--primary, #0052cc);
            box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.15);
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-3, #64748b);
            padding: 0;
            display: flex;
            transition: color var(--duration-fast, 0.15s);
        }

        .password-toggle:hover {
            color: var(--primary, #0052cc);
        }

        .admin-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 0.82rem;
        }

        .admin-remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-2, #475569);
            cursor: pointer;
            font-weight: 500;
        }

        .admin-remember input {
            accent-color: var(--primary, #0052cc);
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary, #0052cc) 0%, #0077c8 100%);
            color: #ffffff;
            border: none;
            border-radius: 9999px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--duration-fast, 0.15s);
            box-shadow: 0 4px 14px rgba(0, 82, 204, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-btn:hover {
            box-shadow: 0 6px 20px rgba(0, 82, 204, 0.35);
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-loader {
            display: none;
        }

        .admin-card-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-subtle, #e2e8f0);
            font-size: 0.76rem;
            color: var(--text-3, #64748b);
            text-align: center;
            line-height: 1.5;
        }
    </style>
    <script src="theme.js"></script>
</head>
<body class="admin-login-body">

    <div class="admin-login-card">
        <div class="admin-brand-header">
            <a href="index.html" class="admin-brand-logo">
                <img src="css/logo.png" alt="CryptoPlexTrade Logo">
                <span>CryptoPlexTrade</span>
            </a>
            <div>
                <span class="admin-badge">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                        <path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3A5.25 5.25 0 0 0 12 1.5Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z" clip-rule="evenodd"/>
                    </svg>
                    Restricted Area
                </span>
            </div>
            <h2>Admin Control Console</h2>
            <p class="sub">Authenticate with security credentials to continue.</p>
        </div>

        <div id="server-error" class="error-message" role="alert"></div>

        <form id="login-form" novalidate>
            <!-- Email -->
            <div class="admin-field">
                <label for="email">Admin Identifier / Email</label>
                <div class="admin-input-wrap">
                    <span class="admin-input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-8.928 5.493a3 3 0 0 1-3.144 0L1.5 8.67Z"/>
                            <path d="M22.5 6.908V6.75a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3v.158l9.714 5.978a1.5 1.5 0 0 0 1.572 0L22.5 6.908Z"/>
                        </svg>
                    </span>
                    <input class="admin-input" type="email" id="email" name="email" required placeholder="admin@cryptoplextrade.com" autocomplete="email">
                </div>
            </div>

            <!-- Password -->
            <div class="admin-field">
                <label for="password">Security Password</label>
                <div class="admin-input-wrap">
                    <span class="admin-input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3A5.25 5.25 0 0 0 12 1.5Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z" clip-rule="evenodd"/>
                        </svg>
                    </span>
                    <input class="admin-input" type="password" id="password" name="password" required placeholder="••••••••••••" autocomplete="current-password">
                    <button type="button" class="password-toggle" data-target="password" aria-label="Toggle password">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3.53 2.47a.75.75 0 0 0-1.06 1.06l18 18a.75.75 0 1 0 1.06-1.06l-18-18ZM22.676 12.553a11.249 11.249 0 0 1-2.631 4.31l-3.099-3.099a5.25 5.25 0 0 0-6.71-6.71L7.759 4.577a11.217 11.217 0 0 1 4.242-.827c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113Z"/><path d="M15.75 12c0 .18-.013.357-.037.53l-4.244-4.243A3.75 3.75 0 0 1 15.75 12ZM12.25 15.75l-4.243-4.244a3.75 3.75 0 0 0 4.243 4.244ZM4.867 16.842l-1.634-1.635a11.25 11.25 0 0 1-1.909-3.655.75.75 0 0 1 0-.553C2.816 6.723 7.03 3.5 12.001 3.5c1.457 0 2.85.294 4.116.826L14.53 5.916A5.251 5.251 0 0 0 8.25 12a5.21 5.21 0 0 0 .617 2.47L4.867 16.842Z"/></svg>
                    </button>
                </div>
            </div>

            <div class="admin-options">
                <label class="admin-remember">
                    <input type="checkbox" id="remember">
                    <span>Keep admin active</span>
                </label>
                <a href="forgot-password.html" style="color: #94a3b8; text-decoration: none;">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">
                <span class="btn-text">Authenticate Session &rarr;</span>
                <span class="btn-loader">Verifying Access…</span>
            </button>
        </form>

        <div class="admin-card-footer">
            Unauthorized access to this control desk is strictly prohibited and logged by IP address.
        </div>
    </div>

    <script>
    // Password Visibility Toggle
    document.querySelectorAll('.password-toggle').forEach(toggle => {
        toggle.addEventListener('click', function() {
            const targetInput = document.getElementById(this.dataset.target);
            const isPassword = targetInput.type === 'password';
            targetInput.type = isPassword ? 'text' : 'password';
        });
    });

    // Form Submission Logic
    document.getElementById('login-form').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const submitBtn = this.querySelector('.login-btn');
        const btnText = submitBtn.querySelector('.btn-text');
        const btnLoader = submitBtn.querySelector('.btn-loader');
        
        btnText.style.display = 'none';
        btnLoader.style.display = 'inline-block';
        submitBtn.disabled = true;
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const serverErrorDiv = document.getElementById('server-error');
        serverErrorDiv.style.display = 'none';

        const formData = { email, password, isAdminLogin: true };

        fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(formData),
        })
        .then(response => response.json().then(data => ({ status: response.status, body: data })))
        .then(({ status, body }) => {
            if (status === 200) {
                if (body.role === 'admin') {
                    window.location.href = '/admin/index.html';
                } else {
                    serverErrorDiv.textContent = 'Access denied. This console is restricted to administrators.';
                    serverErrorDiv.style.display = 'block';
                }
            } else {
                serverErrorDiv.textContent = body.message || 'Invalid administrative credentials or access denied.';
                serverErrorDiv.style.display = 'block';
            }
        })
        .catch(error => {
            console.error('Fetch Error:', error);
            serverErrorDiv.textContent = 'Could not connect to the security server. Please try again.';
            serverErrorDiv.style.display = 'block';
        })
        .finally(() => {
            btnText.style.display = 'inline-block';
            btnLoader.style.display = 'none';
            submitBtn.disabled = false;
        });
    });
    </script>
    <script src="/chat-widget.js"></script>
</body>
</html>
