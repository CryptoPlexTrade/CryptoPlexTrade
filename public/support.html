    <style>
        .ticket-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 0;
            margin: 0;
        }

        .ticket-item {
            background: #ffffff;
            border: 1px solid var(--border-subtle, #e2e8f0);
            border-radius: var(--radius-xl, 16px);
            padding: 22px 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 16px rgba(11, 45, 90, 0.04);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ticket-item:hover {
            border-color: var(--primary, #0052cc);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(11, 45, 90, 0.08);
        }

        .ticket-info .subject {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-1, #0a192f);
            margin-bottom: 6px;
        }

        .ticket-info .last-update {
            font-size: 0.8rem;
            font-family: var(--font-mono, monospace);
            color: var(--text-3, #64748b);
        }

        .ticket-status {
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-open {
            background: #eff6ff;
            color: var(--primary, #0052cc);
            border: 1px solid rgba(0, 82, 204, 0.2);
        }

        .status-closed {
            background: #f8fafc;
            color: var(--text-3, #64748b);
            border: 1px solid var(--border-subtle, #e2e8f0);
        }

        .status-in_progress,
        .status-pending {
            background: #fffbeb;
            color: #b45309;
            border: 1px solid #fde68a;
        }

        .message-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 440px;
            overflow-y: auto;
            padding: 8px 4px;
        }

        .message-item {
            padding: 16px 18px;
            border-radius: var(--radius-md, 10px);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .message-item.admin {
            background: #eff6ff;
            border: 1px solid rgba(0, 82, 204, 0.15);
            align-self: flex-start;
            max-width: 85%;
        }

        .message-item.user {
            background: #f8fafc;
            border: 1px solid var(--border-subtle, #e2e8f0);
            align-self: flex-end;
            max-width: 85%;
        }

        .message-author {
            font-weight: 700;
            font-size: 0.82rem;
            color: var(--primary, #0052cc);
            margin-right: 12px;
        }

        .message-date {
            font-size: 0.75rem;
            font-family: var(--font-mono, monospace);
            color: var(--text-3, #64748b);
        }

        .message-body {
            margin-top: 8px;
            color: var(--text-1, #0a192f);
            white-space: pre-wrap;
        }
    </style>
</head>

    <script>
        (function () {
            // --- Cookie helper ---
            function getCookie(name) {
                const v = `; ${document.cookie}`, p = v.split(`; ${name}=`);
                if (p.length === 2) return p.pop().split(';').shift();
            }
            const csrfToken = getCookie('csrf-token');

            // --- Sign Out ---
            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    try {
                        const r = await fetch('/api/logout', { method: 'POST', headers: { 'X-CSRF-Token': csrfToken } });
                        if (r.ok) window.location.href = 'login.html';
                    } catch (err) { console.error(err); }
                });
            }

            const modal = document.getElementById('details-modal');
            const closeModal = document.getElementById('close-modal-btn');
            const modalSubject = document.getElementById('modal-ticket-subject');
            const modalBody = document.getElementById('modal-body-content');
            const ticketList = document.getElementById('ticket-list');

            async function fetchTickets() {
                try {
                    ticketList.innerHTML = '<li style="text-align:center;padding:32px;color:var(--text-muted);background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border-light);">Loading ticket records…</li>';
                    const r = await fetch('/api/support/tickets', { credentials: 'include' });
                    if (r.status === 401 || r.status === 403) { window.location.href = 'login.html'; return; }
                    if (!r.ok) throw new Error('Could not retrieve tickets.');
                    const tickets = await r.json();

                    ticketList.innerHTML = '';
                    if (tickets.length === 0) {
                        ticketList.innerHTML = '<li style="text-align:center;padding:32px;color:var(--text-muted);background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border-light);">No open tickets. If you need trade or settlement assistance, click "Open New Ticket" above.</li>';
                        return;
                    }

                    tickets.forEach(ticket => {
                        const item = document.createElement('li');
                        item.className = 'ticket-item';
                        item.dataset.ticketId = ticket.id;
                        item.innerHTML = `
                    <div class="ticket-info">
                        <div class="subject"></div>
                        <div class="last-update"></div>
                    </div>
                    <div class="ticket-status"></div>
                `;
                        item.querySelector('.subject').textContent = ticket.subject;
                        item.querySelector('.last-update').textContent = `Last activity: ${new Date(ticket.updated_at).toLocaleString()}`;
                        const statusEl = item.querySelector('.ticket-status');
                        statusEl.className = `ticket-status status-${ticket.status}`;
                        statusEl.textContent = ticket.status.replace('_', ' ');

                        item.addEventListener('click', async () => {
                            try {
                                const dr = await fetch(`/api/support/tickets/${ticket.id}`, { credentials: 'include' });
                                if (!dr.ok) throw new Error('Could not load ticket messages.');
                                const detail = await dr.json();
                                modalSubject.textContent = `Ticket #${detail.ticket.id}: ${detail.ticket.subject}`;
                                modalBody.innerHTML = '';
                                const msgList = document.createElement('div');
                                msgList.className = 'message-list';
                                detail.replies.forEach(reply => {
                                    const div = document.createElement('div');
                                    div.className = `message-item ${reply.is_admin ? 'admin' : 'user'}`;
                                    div.innerHTML = `<div><span class="message-author">${reply.is_admin ? 'Compliance Support' : 'You'}</span><span class="message-date">${new Date(reply.created_at).toLocaleString()}</span></div><div class="message-body"></div>`;
                                    div.querySelector('.message-body').textContent = reply.message;
                                    msgList.appendChild(div);
                                });
                                modalBody.appendChild(msgList);
                                modal.classList.add('show');
                            } catch (err) { alert(err.message); }
                        });
                        ticketList.appendChild(item);
                    });

                    closeModal.addEventListener('click', () => modal.classList.remove('show'));
                    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });

                } catch (e) {
                    ticketList.innerHTML = `<li style="text-align:center;padding:24px;color:var(--accent-red);background:#fff;border-radius:var(--radius-lg);">${e.message}</li>`;
                }
            }

            fetchTickets();
        })();
    </script>
